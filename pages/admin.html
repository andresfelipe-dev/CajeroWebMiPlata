<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mi Plata | Administración</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container navbar"><a class="logo" href="admin.html">MI <span>PLATA</span></a>
            <div class="nav-actions"><a class="btn btn-outline" href="index.html">Cerrar sesión</a></div>
        </div>
    </header>
    <main class="dashboard">
        <div class="container">
            <div class="dashboard-head">
                <div>
                    <div class="breadcrumb">Panel administrativo</div>
                    <h1>Gestión de usuarios</h1>
                </div><button class="btn btn-primary">+ Registrar usuario</button>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Identificación</th>
                            <th>Nombre</th>
                            <th>Usuario</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>123456789</td>
                            <td>Andrés Felipe</td>
                            <td>andres</td>
                            <td><span class="badge badge-success">Activo</span></td>
                            <td><button class="btn btn-secondary">Editar</button> <button
                                    class="btn btn-danger">Eliminar</button></td>
                        </tr>
                        <tr>
                            <td>987654321</td>
                            <td>Usuario ejemplo</td>
                            <td>usuario01</td>
                            <td><span class="badge badge-success">Activo</span></td>
                            <td><button class="btn btn-secondary">Editar</button> <button
                                    class="btn btn-danger">Eliminar</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
