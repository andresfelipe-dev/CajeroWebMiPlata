<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Plata | Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container navbar">
            <a class="logo" href="index.html">MI <span>PLATA</span></a>
            <a class="btn btn-outline" href="index.html">Volver al inicio</a>
        </div>
    </header>
    <main class="auth-page">
        <section class="auth-card auth-card-wide">
            <div class="auth-icon"><span class="icon icon-user" aria-hidden="true"></span></div>
            <h1>Crear cuenta</h1>
            <p>Completa los datos solicitados para registrarte en Mi Plata.</p>
            <form id="formRegistro">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="id">Número de identificación</label>
                        <input id="id" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="nombre">Nombre completo</label>
                        <input id="nombre" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="celular">Número de celular</label>
                        <input id="celular" type="tel" required>
                    </div>
                    <div class="form-group">
                        <label for="usuario">Nombre de usuario</label>
                        <input id="usuario" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="clave">Contraseña</label>
                        <input id="clave" type="password" required>
                    </div>
                    <div class="form-group">
                        <label for="confirmar">Confirmar contraseña</label>
                        <input id="confirmar" type="password" required>
                    </div>
                </div>
                <button class="btn btn-primary btn-full" type="submit">Registrarme</button>
            </form>
        </section>
    </main>
    <script type="module" src="../pages js/registro.js"></script>
</body>

</html>
