<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mi Plata | Perfil</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container navbar"><a class="logo" href="dashboard.html">MI <span>PLATA</span></a><a
                class="btn btn-outline" href="dashboard.html">Volver al panel</a></div>
    </header>
    <main class="dashboard">
        <div class="container">
            <div class="page-title">
                <div class="breadcrumb">Panel / Perfil</div>
                <h1>Mi perfil</h1>
            </div>
            <div class="two-column">
                <section class="card">
                    <h3>Datos personales</h3>
                    <form id="formPerfil">
                        <div class="form-group">
                            <label for="identificacion">Identificación</label>
                            <input type="text" id="identificacion" required>
                        </div>

                        <div class="form-group">
                            <label for="nombreCompleto">Nombre completo</label>
                            <input type="text" id="nombreCompleto" required>
                        </div>

                        <div class="form-group">
                            <label for="celular">Celular</label>
                            <input type="tel" id="celular" required>
                        </div>

                        <div class="form-group">
                            <label for="nombreUsuario">Usuario</label>
                            <input type="text" id="nombreUsuario" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Guardar cambios
                        </button>
                    </form>
                </section>
                <section class="card">
                    <h3>Cambiar contraseña</h3>
                    <form id="formContrasenia">
                        <div class="form-group">
                            <label for="usuarioContrasenia">Usuario</label>
                            <input type="text" id="usuarioContrasenia" required>
                        </div>

                        <div class="form-group">
                            <label for="contraseniaActual">Contraseña actual</label>
                            <input type="password" id="contraseniaActual" required>
                        </div>

                        <div class="form-group">
                            <label for="nuevaContrasenia">Nueva contraseña</label>
                            <input type="password" id="nuevaContrasenia" required>
                        </div>

                        <div class="form-group">
                            <label for="confirmarContrasenia">Confirmar nueva contraseña</label>
                            <input type="password" id="confirmarContrasenia" required>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Cambiar contraseña
                        </button>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <script type="module" src="../pages js/perfil.js"></script>
</body>

</html>
