<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mi Plata | Perfil</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container navbar"><a class="logo" href="dashboard.html">MI <span>PLATA</span></a><a
                class="btn btn-outline" href="dashboard.html">Volver al panel</a></div>
    </header>
    <main class="dashboard">
        <div class="container">
            <div class="page-title">
                <div class="breadcrumb">Panel / Perfil</div>
                <h1>Mi perfil</h1>
            </div>
            <div class="two-column">
                <section class="card">
                    <h3>Datos personales</h3>
                    <form>
                        <div class="form-group"><label>Identificación</label><input value="123456789" disabled></div>
                        <div class="form-group"><label>Nombre completo</label><input
                                value="Andrés Felipe Alzate Grajales"></div>
                        <div class="form-group"><label>Celular</label><input value="3000000000"></div>
                        <div class="form-group"><label>Usuario</label><input value="andres" disabled></div><button
                            class="btn btn-primary">Guardar cambios</button>
                    </form>
                </section>
                <section class="card">
                    <h3>Cambiar contraseña</h3>
                    <form>
                        <div class="form-group"><label>Usuario</label><input></div>
                        <div class="form-group"><label>Contraseña actual</label><input type="password"></div>
                        <div class="form-group"><label>Nueva contraseña</label><input type="password"></div>
                        <div class="form-group"><label>Confirmar nueva contraseña</label><input type="password"></div>
                        <button class="btn btn-primary">Cambiar contraseña</button>
                    </form>
                </section>
            </div>
        </div>
    </main>
</body>

</html>
