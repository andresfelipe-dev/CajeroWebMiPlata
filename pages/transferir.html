<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Mi Plata | Transferir</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <header class="site-header">
        <div class="container navbar"><a class="logo" href="dashboard.html">MI <span>PLATA</span></a><a
                class="btn btn-outline" href="dashboard.html">Volver al panel</a></div>
    </header>
    <main class="auth-page">
        <section class="auth-card" style="width:min(100%,650px)">
            <h1>Transferir dinero</h1>
            <p>Envía dinero entre productos distintos o a otra cuenta.</p>
            <form>
                <div class="form-grid">
                    <div class="form-group"><label>Cuenta origen</label><select>
                            <option>Ahorros</option>
                            <option>Corriente</option>
                        </select></div>
                    <div class="form-group"><label>Tipo de destino</label><select>
                            <option>Producto propio</option>
                            <option>Cuenta de otro usuario</option>
                        </select></div>
                </div>
                <div class="form-group"><label>Cuenta destino</label><input type="text" placeholder="Número de cuenta">
                </div>
                <div class="form-group"><label>Monto</label><input type="number" min="0.01" step="0.01"></div>
                <div class="notice">No se permite transferir al mismo producto de origen.</div><button
                    class="btn btn-primary btn-full">Realizar transferencia</button>
            </form>
        </section>
    </main>
</body>

</html>
